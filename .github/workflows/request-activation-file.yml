name: Request Unity Activation File

# One-time helper: run this manually (Actions tab > this workflow > "Run workflow")
# to generate the .alf file needed to obtain a Unity Personal license for CI.
# See README.md > "CI/CD: Android build via GitHub Actions" for the full process.
# You only need to run this once per Unity account/version, not for every build.

on:
  workflow_dispatch: {}

jobs:
  request-activation-file:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
